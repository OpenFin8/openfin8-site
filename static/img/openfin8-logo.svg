<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- OpenFin8 mark: the consent ring - two arcs (two ledgers) enclosing
       an open aperture (open finance). Palette: the openfin8 accent. -->
  <defs>
    <linearGradient id="of8g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12A38A"/>
      <stop offset="1" stop-color="#0E7C66"/>
    </linearGradient>
  </defs>
  <!-- outer ring: the consent boundary (broken - open by design) -->
  <path d="M 256 64 A 192 192 0 1 0 434 176"
        fill="none" stroke="url(#of8g)" stroke-width="44" stroke-linecap="round"/>
  <!-- inner arcs: the two ledgers -->
  <path d="M 256 160 A 96 96 0 0 1 352 256"
        fill="none" stroke="url(#of8g)" stroke-width="30" stroke-linecap="round" opacity="0.75"/>
  <path d="M 256 352 A 96 96 0 0 1 160 256"
        fill="none" stroke="url(#of8g)" stroke-width="30" stroke-linecap="round" opacity="0.75"/>
  <!-- the aperture dot: the customer at the center of consent -->
  <circle cx="256" cy="256" r="26" fill="url(#of8g)"/>
</svg>